<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提问箱（简易版）</title>
  <style>
    body { margin: 0; padding: 16px; background: #fff; color: #000; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 18px; }
    textarea { width: 100%; box-sizing: border-box; font-family: inherit; }
    #ask-list .q { border: 1px solid #999; padding: 8px; margin: 10px 0; }
    #ask-list .meta { font-size: 12px; color: #666; }
    #ask-list .a { margin-top: 6px; }
    #status { font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>提问箱</h1>
    <textarea id="ask-text" rows="3" placeholder="写一个问题……"></textarea>
    <br>
    <button type="button" id="ask-submit">提交</button>
    <p id="status"></p>
    <div id="ask-list"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ask-lite.js"></script>
</body>
</html>
