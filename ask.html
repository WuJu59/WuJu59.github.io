  <link rel="stylesheet" href="css/base.css">

<body id="top">
  <header class="site-header">
    <h1 class="site-title">提问箱</h1>

    <nav class="nav">

  <main class="wrap">
    <div class="card">
      <p>想问什么都行：经历、想法、爱好、或者单纯想聊聊天。完全匿名，我会认真回答。</p>
      <p class="t-dim">当前问题存在你的浏览器本地，联网同步在路线图里。</p>
    </div>

    <form id="ask-form" class="card">
      <label class="field">
        <span>匿名提问</span>
        <textarea id="ask-text" rows="3" maxlength="300" placeholder="写一个问题……" required></textarea>
      </label>
      <button class="btn" type="submit">丢进提问箱</button>
    </form>

    <section>
      <h2>问题与回答</h2>
      <div id="ask-list"></div>
    </section>
  </main>

  <footer>

  <div id="toast"></div>
