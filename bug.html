<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug 反馈 · WuJu59Web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="themes/retro/theme.css">
</head>
<body id="top">
  <header class="site-header">
    <h1 class="site-title">Bug 反馈</h1>
    <p class="site-subtitle">~ 发现什么问题，告诉我一声 ~</p>
    <nav class="nav">
      <a href="home.html">主页</a>
      <a href="shuoshuo.html">说说</a>
      <a href="album.html">相册</a>
      <a href="ask.html">提问箱</a>
      <a href="guestbook.html">留言板</a>
      <a href="ear-tab.html">耳扒</a>
      <a href="bug.html" class="active">反馈</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="card">
      <p>页面哪里打不开、按钮没反应、留言发不出去……都可以在这里反馈。</p>
      <p class="t-dim">反馈会直接发给站长，别人看不到你的留言内容。</p>
    </div>

    <form id="bug-form" class="card">
      <label class="field">
        <span>问题描述 *</span>
        <textarea id="bug-message" rows="4" maxlength="1000" placeholder="发生了什么？尽量描述清楚……" required></textarea>
      </label>
      <label class="field">
        <span>在哪个页面/操作发生的</span>
        <input id="bug-page" type="text" maxlength="100" placeholder="例如：留言板提交时">
      </label>
      <label class="field">
        <span>联系方式（可选）</span>
        <input id="bug-contact" type="text" maxlength="100" placeholder="邮箱 / QQ / 微信……">
      </label>
      <button class="btn" type="submit">提交反馈</button>
      <p id="bug-status" class="t-dim"></p>
    </form>
  </main>

  <footer>
    <p>© 2026 <span id="footer-name">五九</span> · WuJu59Web ✿</p>
    <p>现在时间：<span id="clock">--:--:--</span></p>
    <div class="webring">
      <a href="index.html">⌂ 回到入口</a>
      <a href="guestbook.html">✎ 给我留言</a>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/bug.js"></script>
  <script src="themes/retro/theme.js"></script>
</body>
</html>
