<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恐龙巴快跑</title>
  <style>
    @font-face {
      font-family: "MisakiMincho";
      src: url("assets/misaki-mincho.ttf") format("truetype");
    }
    html, body {
      margin: 0;
      background: #000;
      font-family: "MisakiMincho", Arial, "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #game-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 520px);
      aspect-ratio: 1;
      border: 5px solid #fff;
      background: #000;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #score-row {
      position: absolute;
      top: 1.5%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #fff;
      z-index: 2;
      pointer-events: none;
    }
    #debug-win {
      position: absolute;
      top: 1.5%;
      right: 1.5%;
      z-index: 3;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid #555;
      font-size: 10px;
      padding: 2px 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }
    #controls button { pointer-events: auto; }
    #game-start {
      padding: 8px 18px;
      background: transparent;
      color: #fff;
      border: none;
      border-radius: 0;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
    }
    #back-btn {
      position: absolute;
      left: 3%;
      bottom: 3%;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    #mute-btn {
      position: absolute;
      right: 3%;
      bottom: 3%;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    #mute-btn svg, #back-btn svg { display: block; }
  </style>
</head>
<body>
  <div id="game-box">
    <canvas id="game-canvas" width="480" height="480" aria-label="恐龙巴快跑"></canvas>
    <div id="score-row"><b id="game-score">0:00 / --:--</b></div>
    <button type="button" id="debug-win">DEBUG</button>
    <div id="controls">
      <button type="button" id="back-btn" title="返回" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="10" y="1" width="2" height="2" fill="#fff"></rect>
          <rect x="8" y="3" width="2" height="2" fill="#fff"></rect>
          <rect x="6" y="5" width="2" height="2" fill="#fff"></rect>
          <rect x="4" y="7" width="2" height="2" fill="#fff"></rect>
          <rect x="6" y="9" width="2" height="2" fill="#fff"></rect>
          <rect x="8" y="11" width="2" height="2" fill="#fff"></rect>
          <rect x="10" y="13" width="2" height="2" fill="#fff"></rect>
        </svg>
      </button>
      <button type="button" id="game-start">開始</button>
      <button type="button" id="mute-btn" title="背景音乐开关"></button>
    </div>
  </div>

  <script>
  /* 恐龙巴快跑：仿 Chrome 小恐龙，独立单页（无任何外部依赖） */
  (function () {
    const canvas = document.getElementById("game-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("game-score");
    const startBtn = document.getElementById("game-start");
    const muteBtn = document.getElementById("mute-btn");

    const bgm = new Audio("assets/background-music.wav");
    bgm.loop = true;
    bgm.preload = "metadata";

    canvas.width = 480;
    canvas.height = 480;
    const GROUND = 400;

    const RUNNER_COLS = 8, RUNNER_ROWS = 4;
    const OB_COLS = 4, OB_ROWS = 2;
    /* l_01 障碍动画：8 列 × 8 行；每行是一种障碍，按各自列播放 */
    const OB2_COLS = 8, OB2_ROWS = 8;
    /* 音乐播放到 2:22.22 后切换为 l_01 障碍动画（每次播放都重新计时） */
    const OB2_SWITCH_TIME = 142.22;
    /* h_04 胜利动画：8 列 × 4 行（每格 40×56） */
    const VIC_COLS = 8, VIC_ROWS = 4;
    const SCALE = 1.6;
    const JUMP_VY = -9.5;
    const GRAVITY = 0.55;
    const HOLD_GRAVITY = 0.26;
    const MAX_HOLD = 60;

    const runnerImg = new Image();
    runnerImg.src = "assets/runner.png";
    const obstacleImg = new Image();
    obstacleImg.src = "assets/obstacle.png";
    const obstacleAnimImg = new Image();
    obstacleAnimImg.src = "assets/obstacle-animated.png";
    const victoryImg = new Image();
    victoryImg.src = "assets/victory.png";
    const finishImg = new Image();
    finishImg.src = "assets/finish.png";

    let runnerFW = 40, runnerFH = 56, obFW = 40, obFH = 56, ob2FW = 40, ob2FH = 56;
    let vicFW = 40, vicFH = 56;
    let runnerBounds = [], obBounds = [], ob2Bounds = [];
    let groundAnchorY = GROUND - 89.6;
    let anchorsReady = false;

    function frameSizes() {
      if (runnerImg.naturalWidth) {
        runnerFW = runnerImg.naturalWidth / RUNNER_COLS;
        runnerFH = runnerImg.naturalHeight / RUNNER_ROWS;
      }
      if (obstacleImg.naturalWidth) {
        obFW = obstacleImg.naturalWidth / OB_COLS;
        obFH = obstacleImg.naturalHeight / OB_ROWS;
      }
      if (obstacleAnimImg.naturalWidth) {
        ob2FW = obstacleAnimImg.naturalWidth / OB2_COLS;
        ob2FH = obstacleAnimImg.naturalHeight / OB2_ROWS;
      }
      if (victoryImg.naturalWidth) {
        vicFW = victoryImg.naturalWidth / VIC_COLS;
        vicFH = victoryImg.naturalHeight / VIC_ROWS;
      }
    }

    function computeBounds() {
      if (!obstacleImg.naturalWidth || !runnerImg.naturalWidth || !obstacleAnimImg.naturalWidth) return;
      const measure = (img, cols, rows, fw, fh) => {
        const c = document.createElement("canvas");
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const cx = c.getContext("2d");
        cx.drawImage(img, 0, 0);
        const { data } = cx.getImageData(0, 0, c.width, c.height);
        const w = c.width, h = c.height;
        const arr = [];
        for (let r = 0; r < rows; r++) {
          for (let col = 0; col < cols; col++) {
            const x0c = Math.floor(col * fw), x1c = Math.floor((col + 1) * fw);
            const y0c = Math.floor(r * fh), y1c = Math.floor((r + 1) * fh);
            let vx = fw, vy = fh, vx1 = -1, vy1 = -1;
            for (let y = y0c; y < y1c; y++) {
              for (let x = x0c; x < x1c; x++) {
                if (data[(y * w + x) * 4 + 3] > 30) {
                  const lx = x - x0c, ly = y - y0c;
                  if (lx < vx) vx = lx;
                  if (lx > vx1) vx1 = lx;
                  if (ly < vy) vy = ly;
                  if (ly > vy1) vy1 = ly;
                }
              }
            }
            arr.push({ vx, vy, vw: vx1 - vx + 1, vh: vy1 - vy + 1 });
          }
        }
        return arr;
      };
      try {
        runnerBounds = measure(runnerImg, RUNNER_COLS, RUNNER_ROWS, runnerFW, runnerFH);
        obBounds = measure(obstacleImg, OB_COLS, OB_ROWS, obFW, obFH);
        ob2Bounds = measure(obstacleAnimImg, OB2_COLS, OB2_ROWS, ob2FW, ob2FH);
      } catch (e) {
        const fb = (fw, fh) => ({ vx: fw * 0.15, vy: fh * 0.15, vw: fw * 0.7, vh: fh * 0.7 });
        runnerBounds = Array.from({ length: RUNNER_COLS * RUNNER_ROWS }, () => fb(runnerFW, runnerFH));
        obBounds = Array.from({ length: OB_COLS * OB_ROWS }, () => fb(obFW, obFH));
        ob2Bounds = Array.from({ length: OB2_COLS * OB2_ROWS }, () => fb(ob2FW, ob2FH));
      }
    }

    function updateAnchors() {
      if (!runnerBounds.length) return;
      let maxBottom = 0;
      for (const b of runnerBounds) maxBottom = Math.max(maxBottom, b.vy + b.vh);
      /* 人物稍微上移 6px，避免视觉上穿地 */
      groundAnchorY = GROUND - (maxBottom / runnerFH) * playerH - 6;
      anchorsReady = true;
    }

    const playerW = runnerFW * SCALE;
    const playerH = runnerFH * SCALE;
    const player = { x: 64, y: groundAnchorY, vy: 0, grounded: true };
    /* 终点角色：与人物镜像对称的右侧位置 */
    const FINISH_X = canvas.width - 64 - playerW;
    const FINISH_W = 40 * SCALE;
    const FINISH_H = 56 * SCALE;

    let obstacles = [];
    let speed = 3.0;
    let over = false;
    let started = false;
    let introFall = false;
    let animatedObstacle = false;
    let victory = false;
    let victoryFrame = 0;
    let frame = 0;
    let lastTime = performance.now();
    let spawnTimer = 80;
    let runFrame = 0;
    let holding = false;
    let holdFrames = 0;
    let bgOffset = 0;

    const stars = [];
    for (let i = 0; i < 30; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * (GROUND * 0.8), r: 1 + Math.random() * 1.5 });
    }

    window.__gameDebug = {
      frameCount: RUNNER_COLS * RUNNER_ROWS,
      playerW: Math.round(playerW),
      playerH: Math.round(playerH),
      obstacleFrames: OB_COLS * OB_ROWS,
      ob2Frames: OB2_COLS * OB2_ROWS,
      victoryFrames: VIC_COLS * VIC_ROWS,
      seek: (t) => { try { bgm.currentTime = t; } catch (e) { /* 忽略 */ } },
      forceSpawn: () => {
        if (!started) return;
        const h = 56 + Math.random() * 48;
        obstacles.push({
          x: canvas.width + 20,
          h,
          w: h * (ob2FW / ob2FH),
          sheet: 1,
          fi: 0,
          row: Math.floor(Math.random() * OB2_ROWS)
        });
      }
    };

    function fmtTime(t) {
      if (!isFinite(t) || t < 0) return "--:--";
      const s = Math.floor(t);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function reset() {
      player.y = groundAnchorY;
      player.vy = 0;
      player.grounded = true;
      obstacles = [];
      speed = 3.0;
      over = false;
      spawnTimer = 80;
      runFrame = 0;
      holding = false;
      holdFrames = 0;
      animatedObstacle = false;
      victory = false;
      victoryFrame = 0;
      scoreEl.textContent = "0:00 / " + (isFinite(bgm.duration) ? fmtTime(bgm.duration) : "--:--");
    }

    function startGame() {
      reset();
      started = true;
      introFall = true;
      player.y = groundAnchorY - 500;
      player.vy = 0;
      player.grounded = false;
      startBtn.textContent = "再開";
      bgm.currentTime = 0;
      bgm.play().catch(() => { /* 浏览器拦截时忽略 */ });
      window.__gameDebug.musicAttempted = (window.__gameDebug.musicAttempted || 0) + 1;
      window.__gameDebug.started = true;
      window.__gameDebug.over = false;
    }

    function jump() {
      /* 只能点「開始/再開」按钮开局，空格/点击画面不启动 */
      if (!started || over) return;
      if (player.grounded) {
        player.vy = JUMP_VY;
        player.grounded = false;
        holding = true;
        holdFrames = 0;
      }
    }

    function releaseJump() {
      holding = false;
    }

    /* 障碍当前帧信息：动画障碍 = 随机一行 + 按列循环；静态 = 随机一帧。
       贴地按当前帧可见底部计算，保证任何帧都踩在地面线上。 */
    function obInfo(o) {
      if (o.sheet === 1) {
        const col = Math.floor(frame / 6) % OB2_COLS;
        const fi = o.row * OB2_COLS + col;
        const b = ob2Bounds[fi] || { vx: 4, vy: 5, vw: ob2FW - 8, vh: ob2FH - 10 };
        return { fi, b, sx: o.w / ob2FW, sy: o.h / ob2FH, anchorY: GROUND - ((b.vy + b.vh) / ob2FH) * o.h };
      }
      const b = obBounds[o.fi] || { vx: 4, vy: 5, vw: obFW - 8, vh: obFH - 10 };
      return { fi: o.fi, b, sx: o.w / obFW, sy: o.h / obFH, anchorY: GROUND - ((b.vy + b.vh) / obFH) * o.h };
    }

    function update(dt) {
      if (over || !started) return;
      frame += dt;
      frameSizes();
      if (!obBounds.length || !runnerBounds.length || !ob2Bounds.length) computeBounds();
      if (runnerBounds.length && !anchorsReady) updateAnchors();

      const g = (holding && player.vy < 0 && holdFrames < MAX_HOLD) ? HOLD_GRAVITY : GRAVITY;
      if (holding) holdFrames += dt;
      if (holdFrames >= MAX_HOLD) holding = false;
      player.vy += g * dt;
      player.y += player.vy * dt;
      if (player.y >= groundAnchorY) {
        player.y = groundAnchorY;
        player.vy = 0;
        player.grounded = true;
        holding = false;
        holdFrames = 0;
        introFall = false;
      }

      const musicTime = started && isFinite(bgm.currentTime) ? bgm.currentTime : 0;
      /* 音乐播完 = 胜利，播放 h_04 胜利动画 */
      if (!victory && isFinite(bgm.duration) && musicTime >= bgm.duration - 0.4) {
        victory = true;
        bgm.pause();
        startBtn.textContent = "再開";
        window.__gameDebug.victory = true;
      }
      if (victory) {
        victoryFrame += dt;
        return;
      }
      animatedObstacle = musicTime >= OB2_SWITCH_TIME;
      speed = Math.min(13, 3.0 + musicTime * 0.05);
      bgOffset += speed * 0.08 * dt;
      scoreEl.textContent = fmtTime(musicTime) + " / " + (isFinite(bgm.duration) ? fmtTime(bgm.duration) : "--:--");

      if (!introFall) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          const useAni = animatedObstacle;
          const h = 56 + Math.random() * 48;
          const fw = useAni ? ob2FW : obFW;
          const fh = useAni ? ob2FH : obFH;
          obstacles.push({
            x: canvas.width + 20 + Math.random() * 60,
            h,
            w: h * (fw / fh),
            sheet: useAni ? 1 : 0,
            fi: useAni ? 0 : Math.floor(Math.random() * (OB_COLS * OB_ROWS)),
            row: useAni ? Math.floor(Math.random() * OB2_ROWS) : 0
          });
          window.__gameDebug.lastObstacleH = Math.round(h);
          spawnTimer = 72 + Math.random() * 70; /* 近距不变，只缩短远距 */
        }
      }
      obstacles.forEach(o => { o.x -= speed * dt; });
      obstacles = obstacles.filter(o => o.x + o.w > -40);

      if (player.grounded) {
        const animSpeed = Math.max(3, Math.round(12 - speed * 0.6));
        runFrame = Math.floor(frame / animSpeed) % (RUNNER_COLS * RUNNER_ROWS);
      }

      const rb = runnerBounds[runFrame] || { vx: runnerFW * 0.15, vy: runnerFH * 0.15, vw: runnerFW * 0.7, vh: runnerFH * 0.7 };
      const sxP = playerW / runnerFW;
      const syP = playerH / runnerFH;
      const pr = {
        x: player.x + rb.vx * sxP + 1,
        y: player.y + rb.vy * syP + 1,
        w: Math.max(2, rb.vw * sxP - 2),
        h: Math.max(2, rb.vh * syP - 2)
      };
      for (const o of obstacles) {
        const info = obInfo(o);
        const or = {
          x: o.x + info.b.vx * info.sx + 1,
          y: info.anchorY + info.b.vy * info.sy + 1,
          w: Math.max(2, info.b.vw * info.sx - 2),
          h: Math.max(2, info.b.vh * info.sy - 2)
        };
        if (pr.x < or.x + or.w && pr.x + pr.w > or.x && pr.y < or.y + or.h && pr.y + pr.h > or.y) {
          over = true;
          bgm.pause();
          startBtn.textContent = "再開";
          window.__gameDebug.musicPaused = true;
          window.__gameDebug.over = true;
          return;
        }
      }

      window.__gameDebug.grounded = player.grounded;
      window.__gameDebug.runFrame = runFrame;
      window.__gameDebug.y = Math.round(player.y);
      window.__gameDebug.holding = holding;
      window.__gameDebug.frame = +frame.toFixed(1);
      window.__gameDebug.speed = +speed.toFixed(2);
      window.__gameDebug.bgOffset = +bgOffset.toFixed(2);
      window.__gameDebug.musicTime = +musicTime.toFixed(2);
      window.__gameDebug.animatedObstacle = animatedObstacle;
      window.__gameDebug.introFall = introFall;
      window.__gameDebug.groundAnchorY = Math.round(groundAnchorY);
      window.__gameDebug.playerVisibleBottom = Math.round(player.y + (rb.vy + rb.vh) * syP);
      window.__gameDebug.obBounds = obBounds.length ? obBounds[0] : null;
      window.__gameDebug.ob2Bounds = ob2Bounds.length ? ob2Bounds[0] : null;
      if (obstacles.length) {
        const info = obInfo(obstacles[0]);
        window.__gameDebug.firstObBottom = Math.round(info.anchorY + (info.b.vy + info.b.vh) * info.sy);
        window.__gameDebug.firstObSheet = obstacles[0].sheet;
        window.__gameDebug.firstObFi = info.fi;
        window.__gameDebug.firstObRow = obstacles[0].sheet === 1 ? Math.floor(info.fi / OB2_COLS) : -1;
        const last = obstacles[obstacles.length - 1];
        const linfo = obInfo(last);
        window.__gameDebug.lastObSheet = last.sheet;
        window.__gameDebug.lastObFi = linfo.fi;
        window.__gameDebug.lastObRow = last.sheet === 1 ? Math.floor(linfo.fi / OB2_COLS) : -1;
        window.__gameDebug.lastObBottom = Math.round(linfo.anchorY + (linfo.b.vy + linfo.b.vh) * linfo.sy);
      }
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      /* 星星：小方块，缓慢向左漂 */
      ctx.fillStyle = "#888";
      for (const s of stars) {
        const sx = ((s.x - bgOffset) % canvas.width + canvas.width) % canvas.width;
        const size = Math.max(1, Math.round(s.r * 2));
        ctx.fillRect(sx, s.y, size, size);
      }
      ctx.fillStyle = "#666";
      ctx.fillRect(0, GROUND, canvas.width, 2);

      /* 障碍：普通随机帧 / 音乐 2:22.22 后的 l_01 动画（每行一种，按列播放） */
      if (!victory) {
        for (const o of obstacles) {
          const info = obInfo(o);
          if (o.sheet === 1) {
            const row = Math.floor(info.fi / OB2_COLS);
            const col = info.fi % OB2_COLS;
            ctx.drawImage(obstacleAnimImg, col * ob2FW, row * ob2FH, ob2FW, ob2FH, o.x, info.anchorY, o.w, o.h);
          } else {
            const obRow = Math.floor(info.fi / OB_COLS);
            const obCol = info.fi % OB_COLS;
            ctx.drawImage(obstacleImg, obCol * obFW, obRow * obFH, obFW, obFH, o.x, info.anchorY, o.w, o.h);
          }
        }
      }

      if (runnerImg.naturalWidth) {
        if (!victory) {
          const row = Math.floor(runFrame / RUNNER_COLS);
          const col = runFrame % RUNNER_COLS;
          ctx.drawImage(runnerImg, col * runnerFW, row * runnerFH, runnerFW, runnerFH, player.x, player.y, playerW, playerH);
        }
      }

      /* 胜利动画：h_04，与人物同位置同大小播放 */
      if (victory && victoryImg.naturalWidth) {
        const idx = Math.floor(victoryFrame / 8) % (VIC_COLS * VIC_ROWS);
        const row = Math.floor(idx / VIC_COLS);
        const col = idx % VIC_COLS;
        ctx.drawImage(victoryImg, col * vicFW, row * vicFH, vicFW, vicFH, player.x, player.y, playerW, playerH);
        /* 中间显示通关文字 */
        ctx.fillStyle = "#fff";
        ctx.font = "28px MisakiMincho, serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("恭喜通過", canvas.width / 2, 140);
        /* 终点角色：时间到了才在右侧出现 */
        if (finishImg.naturalWidth) {
          ctx.drawImage(finishImg, FINISH_X, groundAnchorY, FINISH_W, FINISH_H);
        }
        window.__gameDebug.victoryFrame = Math.floor(victoryFrame / 8);
      }

      /* 失败：撞到障碍物，中间显示「追付かれた」 */
      if (over && !victory) {
        ctx.fillStyle = "#fff";
        ctx.font = "28px MisakiMincho, serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("追付かれた", canvas.width / 2, 140);
      }
    }

    function loop(now) {
      const dt = Math.min(2.5, Math.max(0.25, (now - lastTime) / 16.667));
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        jump();
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        releaseJump();
      }
    });
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      jump();
    });
    canvas.addEventListener("pointerup", releaseJump);
    canvas.addEventListener("pointercancel", releaseJump);
    window.addEventListener("blur", releaseJump);

    startBtn.addEventListener("click", startGame);
    document.getElementById("debug-win").addEventListener("click", () => {
      /* 调试：直接跳到胜利动画 */
      if (!started) startGame();
      over = false;
      victory = true;
      victoryFrame = 0;
      bgm.pause();
      startBtn.textContent = "再開";
      window.__gameDebug.victory = true;
      window.__gameDebug.over = false;
    });
    const MUTE_ON = '<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">' +
      '<rect x="1" y="6" width="3" height="4" fill="#fff"></rect>' +
      '<rect x="4" y="5" width="2" height="6" fill="#fff"></rect>' +
      '<rect x="6" y="3" width="2" height="10" fill="#fff"></rect>' +
      '<rect x="8" y="5" width="1" height="6" fill="#fff"></rect>' +
      '<rect x="9" y="3" width="1" height="10" fill="#fff"></rect>' +
      '<rect x="10" y="1" width="1" height="14" fill="#fff"></rect>' +
      '</svg>';
    const MUTE_OFF = '<svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">' +
      '<rect x="1" y="6" width="3" height="4" fill="#888"></rect>' +
      '<rect x="4" y="5" width="2" height="6" fill="#888"></rect>' +
      '<rect x="6" y="3" width="2" height="10" fill="#888"></rect>' +
      '<rect x="9" y="4" width="2" height="2" fill="#888"></rect>' +
      '<rect x="11" y="6" width="2" height="2" fill="#888"></rect>' +
      '<rect x="9" y="10" width="2" height="2" fill="#888"></rect>' +
      '<rect x="11" y="8" width="2" height="2" fill="#888"></rect>' +
      '<rect x="7" y="8" width="2" height="2" fill="#888"></rect>' +
      '</svg>';
    function renderMute() {
      muteBtn.innerHTML = bgm.muted ? MUTE_OFF : MUTE_ON;
    }
    muteBtn.addEventListener("click", () => {
      bgm.muted = !bgm.muted;
      renderMute();
    });
    renderMute();

    reset();
    frameSizes();
    computeBounds();
    updateAnchors();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
