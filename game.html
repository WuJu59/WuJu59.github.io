  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="themes/retro/theme.css">
  <style>
    #game-wrap { text-align: center; }
    #game-score-row { display: flex; justify-content: center; gap: 24px; font-family: var(--font-mono); margin-bottom: 10px; }
    #game-canvas { max-width: 100%; border: 2px solid var(--border-color); border-radius: 8px; background: #fffdf8; cursor: pointer; }
    #game-state { margin: 10px 0 6px; font-size: 14px; }
    .key-hint { font-size: 13px; color: var(--dim); }
  </style>
</head>
<body id="top">
  <header class="site-header">
    <h1 class="site-title">小游戏</h1>
    <p class="site-subtitle">~ 跳跃障碍，看看你能跑多远 ~</p>

  <main class="wrap">
    <div id="game-wrap" class="card">
      <div id="game-score-row">
        <span>分数：<b id="game-score">0</b></span>
        <span>最高分：<b id="game-best">0</b></span>
      </div>
      <canvas id="game-canvas" width="720" height="240" aria-label="跳跃障碍小游戏"></canvas>
      <p id="game-state">空格 / 点击 跳跃</p>
      <p><button class="btn" type="button" id="game-restart">重新开始</button></p>
      <p class="key-hint">按 空格 或 ↑（按住跳得更高），也可以长按画面；撞到障碍就结束。</p>
    </div>
  </main>
