<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WuJu59Web · 入口</title>
  <meta name="description" content="WuJu59Web：一个复古与现代交织的小站。点击方框进入。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="themes/retro/theme.css">

<body id="top">

  <footer>
    <p>© 2026 <span id="footer-name">五九</span> · WuJu59Web ✿</p>
    <p>made with ♥ &amp; a bit of retro</p>
  </footer>

  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>

  <script src="themes/retro/theme.js"></script>
